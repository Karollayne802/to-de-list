<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <!-- Caminhos relativos à raiz do projeto (igual à principal.html) -->
    <base href="../">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calendário | FlowList</title>

    <!-- Fontes e Bootstrap (mesmos da tela principal) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Estilos -->
    <link rel="stylesheet" href="principal.css">
    <link rel="stylesheet" href="calendario.css">
    <!-- Ajusta o body para viver dentro do quadro da tela principal (sempre por último) -->
    <link rel="stylesheet" href="paginas/pagina.css">
</head>

<body>

                <div class="container-cal d-flex gap-3">
                    <section class="cal-card">
                        <div class="cal-head d-flex align-items-center justify-content-between">
                            <div>
                                <div class="cal-title" id="tituloMes">—</div>
                                <div class="cal-subtitle" id="resumoMes">—</div>
                            </div>
                            <div class="d-flex gap-2 align-items-center">
                                <button class="nav-btn" id="btnHoje" title="Ir para hoje">Hoje</button>
                                <button class="nav-btn icon" id="btnPrev" title="Mês anterior"><i
                                        class="bi bi-chevron-left"></i></button>
                                <button class="nav-btn icon" id="btnNext" title="Próximo mês"><i
                                        class="bi bi-chevron-right"></i></button>
                            </div>
                        </div>

                        <div class="cal-weekdays" id="diasSemana"></div>
                        <div class="cal-grid" id="grade"></div>

                        <div class="cal-foot d-flex align-items-center justify-content-between">
                            <div class="legend d-flex align-items-center gap-3">
                                <span><i class="dot dot-alta"></i> Alta</span>
                                <span><i class="dot dot-media"></i> Média</span>
                                <span><i class="dot dot-baixa"></i> Baixa</span>
                                <span><i class="bi bi-check-lg done-ico"></i> Concluída</span>
                            </div>
                            <button class="btn-new" onclick="trocarTela('tela-tarefas')">
                                <i class="bi bi-list-task"></i> Minhas tarefas
                            </button>
                        </div>

                        <div class="aviso" id="aviso"></div>
                    </section>

                    <aside class="day-card">
                        <div class="day-head">
                            <div class="day-date" id="dataSelecionada">Selecione um dia</div>
                            <div class="day-count" id="contagemDia"></div>
                        </div>

                        <div class="day-list" id="listaDia"></div>

                        <button class="btn-new w-100 justify-content-center" id="btnNovaDoDia">
                            <i class="bi bi-plus-lg"></i> Nova atividade neste dia
                        </button>
                    </aside>
                </div>

    <!-- MODAL DE ATIVIDADE (CALENDÁRIO) -->
    <div class="modal fade" id="modalCalendario" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header border-0">
                    <h5 id="modalCalendarioTitle" class="modal-title">Nova atividade</h5>
                    <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="field-label">Atividade</div>
                    <input id="calInputTitulo" class="form-control mb-3" placeholder="Ex: Estudar capítulo 4" />
                    <div class="field-label">Prioridade</div>
                    <select id="calInputPrioridade" class="form-select mb-3">
                        <option>Alta</option>
                        <option selected>Média</option>
                        <option>Baixa</option>
                    </select>
                    <div class="field-label">Dia</div>
                    <div class="modal-dia" id="dataModal">—</div>
                    <div class="erro" id="erroModal"></div>
                </div>
                <div class="modal-footer border-0">
                    <button class="btn btn-cancel" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-save" id="btnSalvar">Salvar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script/datas.js"></script>
    <script src="script/calendario.js"></script>
    <script src="paginas/navegacao.js"></script>
</body>

</html>
