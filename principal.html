<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlowList</title>

    <!-- Fontes e Bootstrap -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    <!-- Estilos: Barra Lateral, Principal e Calendário -->
    <link rel="stylesheet" href="barraLateral/barra.css">
    <link rel="stylesheet" href="principal.css">
    <link rel="stylesheet" href="calendario.css">

    <style>
        /* O menu compartilhado e o quadro das telas ficam lado a lado dentro do cartão */
        #menu-compartilhado { display: contents; }
        .conteudo { overflow: hidden; }
        #quadro-tela { width: 100%; height: 100%; border: 0; display: block; background: var(--fundo-conteudo); }
    </style>
</head>

<body>

    <!-- Faixa do topo (drag region para Electron) -->
    <div class="barra-topo"></div>

    <div class="cartao">
        <!-- MENU COMPARTILHADO (barraLateral/menu.js) -->
        <div id="menu-compartilhado"></div>

        <!-- ÁREA DE CONTEÚDO: cada tela é um html separado em paginas/, exibido aqui -->
        <main class="conteudo">
            <iframe id="quadro-tela" title="Conteúdo"></iframe>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script src="barraLateral/menu.js"></script>
    <script src="script/principal.js"></script>
</body>

</html>
